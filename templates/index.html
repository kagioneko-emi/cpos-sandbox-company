<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPOS Agent Sandbox Company | Monitoring</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --accent-blue: #1f6feb;
            --accent-green: #238636;
            --accent-red: #f85149;
            --accent-purple: #8957e5;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px 30px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            display: grid;
            grid-template-columns: 350px 1fr 300px;
            flex: 1;
            overflow: hidden;
        }

        .panel {
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }

        .scrollable {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* Timeline Feed */
        .log-entry {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .agent-name {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--accent-blue);
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .event-type {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        /* Pointers List */
        .pointer-item {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .pointer-type {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-bottom: 5px;
        }

        .type-code { background: var(--accent-purple); }
        .type-finding { background: var(--accent-red); }

        /* Controls */
        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.8; }

        pre {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1 style="margin:0; font-size: 1.2rem;">🛡️ CPOS Agent Sandbox Company</h1>
            <span id="status-badge" style="color: var(--text-muted); font-size: 0.8rem;">● System Idle</span>
        </div>
        <button class="btn" onclick="triggerCycle()">Start Work Cycle</button>
    </header>

    <div class="container">
        <!-- Left: Corporate Timeline -->
        <div class="panel">
            <div class="panel-header">Corporate Timeline</div>
            <div id="timeline" class="scrollable">
                <p class="text-muted">No activity recorded.</p>
            </div>
        </div>

        <!-- Center: Live Output / Details -->
        <div class="panel">
            <div class="panel-header">Agent Communication & Details</div>
            <div id="details" class="scrollable">
                <div class="card">
                    <h2>Select an event to see details</h2>
                </div>
            </div>
        </div>

        <!-- Right: Memory Layer (Pointers) -->
        <div class="panel" style="border-right: none;">
            <div class="panel-header">Context Pointers (#ctx)</div>
            <div id="pointers" class="scrollable">
                <p class="text-muted">Memory empty.</p>
            </div>
        </div>
    </div>

    <script>
        async function fetchLogs() {
            const res = await fetch('/api/logs');
            const data = await res.json();
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';
            
            data.logs.reverse().forEach(log => {
                const div = document.createElement('div');
                div.className = 'log-entry';
                div.onclick = () => showDetail(log);
                div.style.cursor = 'pointer';
                div.innerHTML = `
                    <div class="log-header">
                        <span class="agent-name">${log.agent}</span>
                        <span class="timestamp">${new Date(log.timestamp).toLocaleTimeString()}</span>
                    </div>
                    <div class="event-type">${log.event}</div>
                `;
                timeline.appendChild(div);
            });
        }

        async function fetchPointers() {
            const res = await fetch('/api/pointers');
            const data = await res.json();
            const container = document.getElementById('pointers');
            container.innerHTML = '';
            
            data.pointers.reverse().forEach(p => {
                const div = document.createElement('div');
                div.className = 'pointer-item';
                div.innerHTML = `
                    <span class="pointer-type type-${p.type}">${p.type.toUpperCase()}</span>
                    <div style="margin-bottom: 5px;"><code>${p.location}</code></div>
                    <div style="color: var(--text-muted); font-size: 0.75rem;">${p.summary}</div>
                `;
                container.appendChild(div);
            });
        }

        function showDetail(log) {
            const details = document.getElementById('details');
            details.innerHTML = `
                <h3>${log.agent} > ${log.event}</h3>
                <p class="timestamp">${log.timestamp}</p>
                <pre>${JSON.stringify(log.metadata, null, 2)}</pre>
            `;
        }

        async function triggerCycle() {
            document.getElementById('status-badge').innerText = '● Cycle in progress...';
            document.getElementById('status-badge').style.color = 'var(--accent-blue)';
            await fetch('/api/trigger', { method: 'POST' });
            setTimeout(updateAll, 2000); // Polling delay
        }

        function updateAll() {
            fetchLogs();
            fetchPointers();
        }

        setInterval(updateAll, 3000);
        updateAll();
    </script>
</body>
</html>
